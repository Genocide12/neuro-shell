name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Check JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file"; done

      - name: Verify generated site copies
        run: cmp index.html internal/site/index.html

      - name: Test Go packages
        run: go test ./...

      - name: Build NeuroShell.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o NeuroShell.exe ./cmd/neuroshell

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NeuroShell.exe
          generate_release_notes: true
